<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
	:root{
	--black: #0a0a0a;
	--charcoal: #151515;
	--grey: #2a2a2a;
	--grey-line: #3d3d3a;
	--white: #ece9e2;
	--white-dim: #8f8c85;
	--gold: #cda545;
	--gold-bright: #f0cf7d;
	}

	*{ box-sizing:border-box; margin:0; padding:0; }

	html,body{
	height:100%;
	background:var(--black);
	color:var(--white);
	font-family:'Inter',sans-serif;
	overflow:hidden;
	}

	.display{ font-family:'Oranienbaum', serif; }

	#stage{
	position:relative;
	width:100vw;
	height:100vh;
	display:flex;
	align-items:center;
	justify-content:center;
	}

	canvas#particles{
	position:absolute;
	inset:0;
	width:100%;
	height:100%;
	z-index:1;
	pointer-events:none;
	}

	/* ---------- LOCK SCREEN ---------- */
	#lock{
	position:relative;
	z-index:3;
	width:min(90vw, 380px);
	text-align:center;
	transition:opacity 0.8s ease, filter 0.8s ease;
	}

	#lock.hidden{
	opacity:0;
	filter:blur(6px);
	pointer-events:none;
	}

	.eyebrow{
	font-size:0.7rem;
	letter-spacing:0.35em;
	text-transform:uppercase;
	color:var(--gold);
	margin-bottom:18px;
	}

	h1.lock-title{
	font-size:clamp(1.8rem, 5vw, 2.6rem);
	font-weight:400;
	letter-spacing:0.04em;
	margin-bottom:28px;
	color:var(--white);
	}

	#passcode{
	width:100%;
	background:transparent;
	border:none;
	border-bottom:1px solid var(--grey-line);
	color:var(--gold-bright);
	font-family:'Oranienbaum', serif;
	font-size:1.6rem;
	letter-spacing:0.5em;
	text-align:center;
	padding:12px 0 14px 0.5em;
	outline:none;
	transition:border-color 0.3s ease;
	}
	#passcode:focus{ border-color:var(--gold); }
	#passcode::placeholder{
	color:var(--white-dim);
	letter-spacing:0.3em;
	font-size:1rem;
	}

	#submit{
	margin-top:26px;
	background:none;
	border:1px solid var(--gold);
	color:var(--gold);
	font-family:'Inter',sans-serif;
	font-size:0.75rem;
	letter-spacing:0.25em;
	text-transform:uppercase;
	padding:12px 30px;
	cursor:pointer;
	transition:background 0.25s ease, color 0.25s ease;
	}
	#submit:hover, #submit:focus-visible{
	background:var(--gold);
	color:var(--black);
	outline:none;
	}

	#error{
	margin-top:16px;
	height:16px;
	font-size:0.75rem;
	letter-spacing:0.08em;
	color:#b5544f;
	opacity:0;
	transition:opacity 0.3s ease;
	}
	#error.show{ opacity:1; }

	@keyframes shake{
	10%,90%{ transform:translateX(-1px); }
	20%,80%{ transform:translateX(2px); }
	30%,50%,70%{ transform:translateX(-4px); }
	40%,60%{ transform:translateX(4px); }
	}
	.shake{ animation:shake 0.5s; }

	/* ---------- REVEAL ---------- */
	#reveal{
	position:absolute;
	top:50%;
	left:50%;
	transform:translate(-50%,-50%);
	z-index:3;
	width:min(92vw, 460px);
	max-height:88vh;
	overflow-y:auto;
	scrollbar-width:none;
	-ms-overflow-style:none;
	padding:4px 4px 24px;
	text-align:center;
	opacity:0;
	pointer-events:none;
	transition:opacity 0.8s ease;
	}
	#reveal::-webkit-scrollbar{ display:none; }
	#reveal.active{ opacity:1; pointer-events:auto; }

	.guest-label{
	font-size:0.7rem;
	letter-spacing:0.3em;
	text-transform:uppercase;
	color:var(--white-dim);
	margin-bottom:6px;
	}

	.guest-name{
	font-size:clamp(1.3rem, 4vw, 1.7rem);
	color:var(--white);
	margin-bottom:34px;
	font-weight:400;
	}

	.divider{
	width:40px;
	height:1px;
	background:var(--grey-line);
	margin:22px auto 26px;
	}

	.countdown-label{
	font-size:0.7rem;
	letter-spacing:0.3em;
	text-transform:uppercase;
	color:var(--white-dim);
	margin-bottom:10px;
	}

	.countdown-timer{
	font-family:'Oranienbaum', serif;
	font-size:clamp(1.3rem, 4vw, 1.7rem);
	letter-spacing:0.06em;
	color:var(--gold-bright);
	margin-bottom:34px;
	}

	.team-name{
	position:relative;
	font-size:clamp(2.2rem, 8vw, 3.4rem);
	color:var(--gold-bright);
	letter-spacing:0.03em;
	margin-bottom:8px;
	text-shadow:0 0 18px rgba(240,207,125,0.25);
	}

	/* glitch effect, triggered via .glitching class */
	.team-name.glitching{
	animation:glitch-anim 0.6s steps(2,end) 2;
	}
	.team-name.glitching::before,
	.team-name.glitching::after{
	content:attr(data-text);
	position:absolute;
	left:0; top:0; width:100%;
	background:var(--black);
	}
	.team-name.glitching::before{
	color:#8fb3c9;
	clip-path:inset(0 0 55% 0);
	animation:glitch-shift-1 0.6s steps(2,end) 2;
	}
	.team-name.glitching::after{
	color:#b5544f;
	clip-path:inset(55% 0 0 0);
	animation:glitch-shift-2 0.6s steps(2,end) 2;
	}
	@keyframes glitch-anim{
	0%,100%{ opacity:1; }
	45%{ opacity:0.85; transform:translateX(1px); }
	55%{ opacity:0.9; transform:translateX(-1px); }
	}
	@keyframes glitch-shift-1{
	0%,100%{ transform:translate(0,0); }
	50%{ transform:translate(-3px,-1px); }
	}
	@keyframes glitch-shift-2{
	0%,100%{ transform:translate(0,0); }
	50%{ transform:translate(3px,1px); }
	}

	.roster-label{
	font-size:0.7rem;
	letter-spacing:0.3em;
	text-transform:uppercase;
	color:var(--white-dim);
	margin-bottom:16px;
	}

	#roster{
	list-style:none;
	display:flex;
	flex-direction:column;
	gap:10px;
	}
	.reveal-list li{
	font-family:'Oranienbaum', serif;
	font-size:1.1rem;
	color:var(--white);
	padding:9px 0;
	border-bottom:1px solid var(--grey);
	opacity:0;
	transform:translateY(10px);
	transition:opacity 0.6s ease, transform 0.6s ease;
	}
	.reveal-list li.shown{ opacity:1; transform:translateY(0); }
	#roster li.you{ color:var(--gold-bright); }
	#roster li.you::after{
	content:' — you';
	font-family:'Inter',sans-serif;
	font-size:0.75rem;
	color:var(--gold);
	letter-spacing:0.05em;
	}

	.theme-link{
	display:inline-block;
	color:var(--gold-bright);
	font-family:'Oranienbaum', serif;
	font-size:clamp(1.3rem, 4vw, 1.7rem);
	letter-spacing:0.04em;
	text-decoration:none;
	border-bottom:1px solid var(--gold);
	padding-bottom:2px;
	transition:color 0.25s ease, border-color 0.25s ease;
	}
	.theme-link:hover{
	color:var(--white);
	border-color:var(--white-dim);
	}

	@media (prefers-reduced-motion: reduce){
	.reveal-list li{ transition:opacity 0.3s ease; transform:none; }
	.team-name.glitching{ animation:none; }
	.team-name.glitching::before,
	.team-name.glitching::after{ display:none; }
	}
</style>
</head>
<body>

<div id="stage">
  <canvas id="particles"></canvas>

  <div id="lock">
    <div class="eyebrow">Halloween Gathering</div>
    <h1 class="lock-title display">Enter your code</h1>
    <input id="passcode" maxlength="6" inputmode="numeric" autocomplete="off" placeholder="— — — —" aria-label="Personal passcode">
    <div><button id="submit">Unlock</button></div>
    <div id="error">Code not recognized. Try again.</div>
  </div>

  <div id="reveal">
    <div class="guest-label">Assigned to</div>
    <div class="guest-name display" id="guestName"></div>
	<div class="countdown-label">Team Revealed In</div>
	<div class="countdown-timer display" id="countdown">00d 00h 00m 00s</div>
	<div class="team-name display" id="teamName"></div>
    <div class="divider"></div>
    <ul id="roster" class="reveal-list"></ul>

    <div class="divider"></div>
    <a id="sheetLink" class="theme-link" href="#" target="_blank" rel="noopener">Potluck Sign Up</a>

    <div class="divider"></div>
    <div class="team-name display">Trivia Movie List</div>
    <ul id="movieList" class="reveal-list"></ul>
  </div>
</div>

<script>
	/* ============================================================
	EDIT THIS SECTION: guest passcodes, team names, rosters.
	Each key is the private passcode you assign to that guest.
	"team" is shown on their reveal. "roster" is the full team
	list — that guest's own name should also appear in it, and
	will be auto-highlighted as "you".
	============================================================ */
	const GUESTS = {
	// ...add one entry per guest with their own unique 4-digit code
	"7625": { name: "Marisol", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"4764": { name: "Jesus", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"1355": { name: "Juan", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"1706": { name: "Evelyn", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"5925": { name: "Diego", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"2806": { name: "Adrian", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"7870": { name: "Isaac", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"4649": { name: "William", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"1233": { name: "Jonathan", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"7186": { name: "Daniel", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"6506": { name: "Nathalie", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"5265": { name: "Luis", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"8648": { name: "Pelon", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"5610": { name: "Gaby", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"5917": { name: "Xavier", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"1774": { name: "Omar", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"3939": { name: "Dennis", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"9852": { name: "Kathya", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"3985": { name: "Nathalie", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"8794": { name: "Jamil", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"9919": { name: "Yvonne", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] },
	"6543": { name: "Ricky", team: " Team", roster: ["Guest One","Guest Two","Guest Three","Guest Four","Guest Five"] }
	};
	/* ============================================================ */

	/* ============================================================
	EDIT: link to a Google Sheet (or any page) shown after the
	team reveal — e.g. party details, a packing list, directions.
	============================================================ */
	const SPREADSHEET_URL = "https://docs.google.com/spreadsheets/d/1kW8hWA10BKXkQwlsXiq55qwD-PBtSUJ5NzBVbqKysrY/edit?usp=sharing";

	/* ============================================================
	EDIT: the three movies for trivia night.
	============================================================ */
	const TRIVIA_MOVIES = ["Movie One", "Movie Two", "Movie Three"];

	document.getElementById('sheetLink').href = SPREADSHEET_URL;

	const movieListEl = document.getElementById('movieList');
	TRIVIA_MOVIES.forEach(title=>{
	const li = document.createElement('li');
	li.textContent = title;
	movieListEl.appendChild(li);
	});

	/*---------------- live countdown to October 1st ---------------- */
	function getOctoberFirst(){
	const now = new Date();
	return new Date(now.getFullYear(), 9, 1, 0, 0, 0); // Month is 0-indexed (9 = October)
	}
	
	function pad(n){ return n.toString().padStart(2, '0'); }
	
	function tickCountdown(){
	const el = document.getElementById('countdown');
	const diff = getOctoberFirst() - new Date();
	if(diff <= 0){
		el.textContent = "00d 00h 00m 00s";
		return;
	}
	const days = Math.floor(diff / (1000 * 60 * 60 * 24));
	const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
	const minutes = Math.floor((diff / (1000 * 60)) % 60);
	const seconds = Math.floor((diff / 1000) % 60);
	el.textContent = `${pad(days)}d ${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s`;
	}
	tickCountdown();
	setInterval(tickCountdown, 1000);

	const lock = document.getElementById('lock');
	const reveal = document.getElementById('reveal');
	const passInput = document.getElementById('passcode');
	const submitBtn = document.getElementById('submit');
	const errorEl = document.getElementById('error');
	const guestNameEl = document.getElementById('guestName');
	const teamNameEl = document.getElementById('teamName');
	const rosterEl = document.getElementById('roster');

	function attempt(){
	const code = passInput.value.trim();
	const guest = GUESTS[code];
	if(!guest){
	errorEl.classList.add('show');
	lock.classList.add('shake');
	setTimeout(()=>lock.classList.remove('shake'), 500);
	return;
	}
	errorEl.classList.remove('show');
	lock.classList.add('hidden');
	setTimeout(()=> runReveal(guest), 700);
	}

	submitBtn.addEventListener('click', attempt);
	passInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') attempt(); });

	function runReveal(guest){
	guestNameEl.textContent = guest.name;
	teamNameEl.textContent = guest.team;
	teamNameEl.setAttribute('data-text', guest.team);
	rosterEl.innerHTML = '';
	guest.roster.forEach(member=>{
	const li = document.createElement('li');
	li.textContent = member;
	if(member === guest.name) li.classList.add('you');
	rosterEl.appendChild(li);
	});

	reveal.classList.add('active');

	setTimeout(()=>{
	teamNameEl.classList.add('glitching');
	setTimeout(()=>teamNameEl.classList.remove('glitching'), 700);
	}, 400);

	const items = rosterEl.querySelectorAll('li');
	items.forEach((li, i)=>{
	setTimeout(()=> li.classList.add('shown'), 900 + i * 380);
	});

	const movieItems = movieListEl.querySelectorAll('li');
	const movieStart = 900 + items.length * 380 + 400;
	movieItems.forEach((li, i)=>{
	setTimeout(()=> li.classList.add('shown'), movieStart + i * 380);
	});
	}

	/* ---------------- ambient ember particles ---------------- */
	const canvas = document.getElementById('particles');
	const ctx = canvas.getContext('2d');
	let particles = [];
	const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

	function resize(){
	canvas.width = window.innerWidth;
	canvas.height = window.innerHeight;
	}
	window.addEventListener('resize', resize);
	resize();

	function makeParticle(){
	return {
	x: Math.random() * canvas.width,
	y: canvas.height + Math.random() * 40,
	r: Math.random() * 1.6 + 0.4,
	speed: Math.random() * 0.4 + 0.15,
	drift: (Math.random() - 0.5) * 0.3,
	alpha: Math.random() * 0.5 + 0.15
	};
	}

	const PARTICLE_COUNT = reduceMotion ? 0 : 55;
	for(let i=0;i<PARTICLE_COUNT;i++) particles.push(makeParticle());

function tick(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.y -= p.speed;
    p.x += p.drift;
    if(p.y < -10){ Object.assign(p, makeParticle(), {y: canvas.height + 10}); }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(205,165,69,${p.alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(tick);
}
if(!reduceMotion) tick();
</script>
</body>
</html>
